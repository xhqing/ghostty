name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # 固定自签证书签名（Issue #2）。证书一旦投入使用就不要重建：TCC 的辅助功能
  # 授权按签名身份匹配，换证书 = 换身份 = 所有机器要重新授权一轮。
  # 来自 fork 的 PR 拿不到 secrets，此时回退到 ad-hoc 签名，保证 CI 仍能出产物。
  MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
  MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
  MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
  MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode Select
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Install Zig 0.15.2
        run: |
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.6
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip > sparkle.zip
          unzip sparkle.zip
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Build GhosttyKit
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string=1.3.1

      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild -target Ghostty -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Update Info.plist
        run: |
          GHOSTTY_COMMIT=$(git rev-parse --short HEAD)
          GHOSTTY_BUILD=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTY_COMMIT" "macos/build/Release/Ghostty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GHOSTTY_BUILD" "macos/build/Release/Ghostty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.3.1" "macos/build/Release/Ghostty.app/Contents/Info.plist"

      - name: Import signing certificate
        if: env.MACOS_SIGNING_CERTIFICATE != ''
        run: |
          # base64 的 .p12 还原成文件，导入一次性 keychain
          echo "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MACOS_SIGNING_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_SIGNING_KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_SIGNING_KEYCHAIN_PASSWORD" build.keychain

          # 自签证书不在任何信任链上：不把它标成可信根，codesign 根本找不到这个
          # 身份（`security find-identity -p codesigning -v` 会是 0 valid identities）。
          # 这里把信任写进系统域并只限 codesign 策略；runner 是一次性的，用完即销毁。
          openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -out "$RUNNER_TEMP/certificate.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/certificate.pem"

          security find-identity -p codesigning -v build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/certificate.pem"

      - name: Codesign with certificate
        if: env.MACOS_SIGNING_CERTIFICATE != ''
        run: |
          # Sparkle 里嵌套的可执行文件单独签，且不套 App 本体的 entitlements；
          # 最后再签 App 本体。与上游 release 的签名顺序一致。
          FRAMEWORK="macos/build/Release/Ghostty.app/Contents/Frameworks/Sparkle.framework"
          for target in \
            "$FRAMEWORK/Versions/B/XPCServices/Downloader.xpc" \
            "$FRAMEWORK/Versions/B/XPCServices/Installer.xpc" \
            "$FRAMEWORK/Versions/B/Autoupdate" \
            "$FRAMEWORK/Versions/B/Updater.app" \
            "$FRAMEWORK" \
            "macos/build/Release/Ghostty.app/Contents/PlugIns/DockTilePlugin.plugin"; do
            /usr/bin/codesign --verbose --force --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" "$target"
          done

          /usr/bin/codesign --verbose --force --options runtime \
            --entitlements macos/Ghostty.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "macos/build/Release/Ghostty.app"

      - name: Ad-hoc codesign (no signing certificate available)
        if: env.MACOS_SIGNING_CERTIFICATE == ''
        run: |
          /usr/bin/codesign --verbose --force --deep --sign - \
            --entitlements macos/Ghostty.entitlements \
            "macos/build/Release/Ghostty.app"

      - name: Verify signature
        run: |
          /usr/bin/codesign --verify --deep --strict --verbose=2 "macos/build/Release/Ghostty.app"
          /usr/bin/codesign -dv --verbose=4 "macos/build/Release/Ghostty.app" 2> signature.txt
          cat signature.txt
          if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            # 证书签名必须能读出证书身份，否则说明签名没生效（又退回 ad-hoc 了）
            grep -q "Authority=$MACOS_SIGNING_IDENTITY" signature.txt

            # 记下 designated requirement：TCC 的辅助功能授权就是按它匹配的。
            # 同一张证书签的不同构建，这行必须完全一致，否则授权又会失效。
            /usr/bin/codesign -d --requirements - "macos/build/Release/Ghostty.app"
          else
            grep -q "Signature=adhoc" signature.txt
          fi

      - name: Zip
        run: |
          cd macos/build/Release
          zip -9 -r --symlinks ../../../Ghostty.app.zip Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-app
          path: Ghostty.app.zip
          # 产物只用来「真机验收某个提交」与「发版时取二进制」，留一周足够；
          # 过期由 GitHub 自动回收，不再需要每天跑定时清理工作流。
          retention-days: 7

      - name: Cleanup signing keychain
        if: always() && env.MACOS_SIGNING_CERTIFICATE != ''
        run: |
          security delete-keychain build.keychain || true